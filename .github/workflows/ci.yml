name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: barber-shop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit initial lockfile
        if: github.event_name == 'push'
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --short -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: find src public test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build production container
        run: docker build -t barber-shop:ci .
      - name: Smoke-test production container
        run: |
          docker run -d --name barber-shop-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_dummy \
            barber-shop:ci
          trap 'docker rm -f barber-shop-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs barber-shop-smoke
          exit 1
