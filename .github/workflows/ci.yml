name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: barber-shop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Commit initial lockfile
        if: github.event_name == 'push'
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --short -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: find src public test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build production container
        run: docker build -t barber-shop:ci .
